[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finxplore"
version = "0.1.0"
description = "FinXplore backend: SEC data pipeline, API Lambdas and guarded AI analyst"
requires-python = ">=3.12"
dependencies = [
  "aws-lambda-powertools[tracer]>=3.0",
  "requests>=2.32",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
# pandas/pyarrow come from the AWS SDK for pandas Lambda layer in AWS;
# install locally for pipeline work and tests.
pipeline = ["pandas>=2.2", "pyarrow>=17"]
dev = [
  "boto3>=1.35",
  "pytest>=8.3",
  "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
